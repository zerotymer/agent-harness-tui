# CI for agent-harness-tui (instructions 0012, 0025).
# Official actions only, pinned to commit SHAs (tag in the trailing comment).
# pnpm comes from package.json "packageManager" via Corepack, so no
# third-party setup action is needed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: pnpm
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint
        # Formatting is checked on Linux only.
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Pack
        # `pnpm test` already built dist/; the tarball excludes test files.
        run: pnpm pack --pack-destination pack

      - name: Install smoke
        # Installs the tarball the way users do, then runs the command.
        run: |
          npm install -g ./pack/agent-harness-tui-*.tgz
          agent-harness-tui --version
          set +e
          agent-harness-tui < /dev/null
          code=$?
          set -e
          if [ "$code" != 2 ]; then
            echo "::error::expected exit code 2 without a terminal, got $code"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: agent-harness-tui-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 14
