# Release for agent-harness-tui (instructions 0014, 0025).
# Pushing a `v*` tag that matches package.json tests and smoke-installs the
# `pnpm pack` tarball on Linux, Windows and macOS, then publishes the tarball
# with SHA256SUMS as a GitHub Release. Users install it with
# `npm install -g <tarball URL>`; nothing is published to the npm registry.
# Official actions only, pinned to commit SHAs (tag in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: pnpm
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Pack
        run: pnpm pack --pack-destination pack

      - name: Install smoke
        run: |
          npm install -g ./pack/agent-harness-tui-*.tgz
          agent-harness-tui --version

      # The tarball is platform-independent; publish the Linux one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: release-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes ./*
